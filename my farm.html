<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>my farm — إدارة القطيع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F3ECDD; }
  body { font-family: 'Tajawal', sans-serif; }
  ::placeholder { color: #8C8064; opacity: .7; }
  button { font-family: inherit; }
  #root { min-height: 100vh; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback } = React;

// ---------------- design tokens (بيج فاتح) ----------------
const C = {
  bg: "#F3ECDD", surface: "#FFFFFF", surface2: "#EBE1CB", text: "#3B3324",
  muted: "#8C8064", border: "#E1D6BB", olive: "#6E7B45", gold: "#C79A3E",
  brick: "#A8503A", blue: "#4472A8",
};

const TAG_COLORS = [
  { v: "أحمر", hex: "#C0392B" }, { v: "أزرق", hex: "#2E6E9E" }, { v: "أصفر", hex: "#D4B106" },
  { v: "أخضر", hex: "#4C7A3D" }, { v: "برتقالي", hex: "#CC7A2E" }, { v: "أبيض", hex: "#F5F1E6" },
  { v: "أسود", hex: "#2B2620" }, { v: "وردي", hex: "#C97B9C" }, { v: "بنفسجي", hex: "#7A5FA0" },
];

const EXPENSE_CATEGORIES = ["حلال", "مكعب", "حشائش", "أدوية", "فيتامينات", "ماء", "رواتب", "صيانة", "بنزين", "إيجار", "تطعيمات", "أخرى"];

function uid() { return Math.random().toString(36).slice(2, 9); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) { if (!iso) return "—"; return new Date(iso).toLocaleDateString("ar", { day: "numeric", month: "short", year: "numeric" }); }
function daysBetween(a, b) { return Math.floor((b - a) / 86400000); }
function tagHex(color) { return (TAG_COLORS.find((t) => t.v === color) || {}).hex || C.muted; }

function seed() { return { animals: [], pens: [], expenses: [], sales: [] }; }

// ---------------- shared UI ----------------
const inputStyle = { background: C.bg, border: `1px solid ${C.border}`, color: C.text, borderRadius: 10, padding: "10px 12px", fontSize: 14, outline: "none", fontFamily: "inherit", width: "100%" };
const btnPrimary = { background: C.olive, color: "#fff", border: "none", borderRadius: 10, padding: "10px 16px", fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" };
const btnGhost = { background: "none", color: C.text, border: `1px solid ${C.border}`, borderRadius: 10, padding: "8px 12px", fontSize: 12, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" };
const iconBtn = { background: "none", border: "none", color: C.muted, cursor: "pointer", padding: 6, flexShrink: 0 };

function Field({ label, children }) {
  return <label style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 13, color: C.muted }}>{label}{children}</label>;
}
function Chip({ color, children }) {
  return <span style={{ background: `${color}1F`, color, border: `1px solid ${color}55`, padding: "3px 10px", borderRadius: 999, fontSize: 12, fontWeight: 700, whiteSpace: "nowrap" }}>{children}</span>;
}
function TagBadge({ number, color }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, background: C.surface2, borderRadius: 999, padding: "3px 10px 3px 4px", fontSize: 13, fontWeight: 700 }}>
      <span style={{ width: 14, height: 14, borderRadius: "50%", background: tagHex(color), border: color === "أبيض" ? `1px solid ${C.border}` : "none" }} />
      #{number}
    </span>
  );
}
function Modal({ title, onClose, children, width = 420 }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(59,51,36,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 16 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: C.surface, borderRadius: 16, width: "100%", maxWidth: width, padding: 22, boxShadow: "0 20px 50px rgba(59,51,36,0.3)", maxHeight: "88vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h3 style={{ margin: 0, fontFamily: "'El Messiri', serif", fontSize: 18, color: C.text }}>{title}</h3>
          <button onClick={onClose} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 18 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function StatCard({ label, value, color, sub }) {
  return (
    <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: "14px 16px", flex: 1, minWidth: 100 }}>
      <div style={{ fontSize: 24, fontWeight: 700, color: color || C.text, fontFamily: "'El Messiri', serif" }}>{value}</div>
      <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>{label}</div>
      {sub && <div style={{ fontSize: 11, color, marginTop: 2 }}>{sub}</div>}
    </div>
  );
}
function IconStat({ icon, label, value, color, onClick }) {
  return (
    <button onClick={onClick} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, flex: 1, minWidth: 76, background: "none", border: "none", cursor: "pointer", padding: 4, fontFamily: "inherit" }}>
      <div style={{ width: 44, height: 44, borderRadius: 12, background: `${color}1A`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 19 }}>{icon}</div>
      <div style={{ fontSize: 15, fontWeight: 700, color: C.text }}>{value}</div>
      <div style={{ fontSize: 10.5, color: C.muted, textAlign: "center" }}>{label}</div>
    </button>
  );
}
function EmptyState({ text }) {
  return <div style={{ textAlign: "center", padding: "36px 16px", color: C.muted, background: C.surface, border: `1px dashed ${C.border}`, borderRadius: 14, fontSize: 13 }}>{text}</div>;
}
function MiniBar({ value, max, color }) {
  const pct = max > 0 ? Math.max(3, Math.round((value / max) * 100)) : 0;
  return <div style={{ height: 8, borderRadius: 4, background: C.bg, overflow: "hidden" }}><div style={{ height: "100%", width: `${pct}%`, background: color, borderRadius: 4 }} /></div>;
}

// ---------------- bell ----------------
function AlertBell({ alerts, open, setOpen, onDismiss }) {
  return (
    <div style={{ position: "relative" }}>
      <button onClick={() => setOpen((o) => !o)} style={{ position: "relative", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, width: 42, height: 42, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 18 }}>
        🔔
        {alerts.length > 0 && (
          <span style={{ position: "absolute", top: -5, insetInlineStart: -5, background: C.brick, color: "#fff", fontSize: 11, fontWeight: 700, borderRadius: 999, minWidth: 18, height: 18, display: "flex", alignItems: "center", justifyContent: "center", border: `2px solid ${C.bg}` }}>{alerts.length}</span>
        )}
      </button>
      {open && (
        <div style={{ position: "absolute", top: 48, insetInlineEnd: 0, width: 300, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, boxShadow: "0 14px 40px rgba(59,51,36,0.25)", zIndex: 55, overflow: "hidden" }}>
          <div style={{ padding: "12px 14px", borderBottom: `1px solid ${C.border}`, fontWeight: 700, fontSize: 14 }}>التنبيهات ({alerts.length})</div>
          <div style={{ maxHeight: 280, overflowY: "auto" }}>
            {alerts.length === 0 ? (
              <div style={{ padding: 20, color: C.muted, fontSize: 13, textAlign: "center" }}>لا توجد تنبيهات حالياً</div>
            ) : alerts.map((a) => (
              <div key={a.id} style={{ padding: "10px 14px", borderBottom: `1px solid ${C.border}`, display: "flex", gap: 8, alignItems: "flex-start" }}>
                <span style={{ fontSize: 14 }}>{a.kind === "pen" ? "🧱" : "💉"}</span>
                <div style={{ flex: 1, fontSize: 12.5 }}>{a.text}</div>
                <button onClick={() => onDismiss(a.id)} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", padding: 2 }}>✕</button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ==================================================================
// APP
// ==================================================================
function App() {
  const initial = useMemo(seed, []);
  const [animals, setAnimals] = useState(initial.animals);
  const [pens, setPens] = useState(initial.pens);
  const [expenses, setExpenses] = useState(initial.expenses);
  const [sales, setSales] = useState(initial.sales);

  const [page, setPage] = useState("home");
  const [selectedId, setSelectedId] = useState(null);
  const [bellOpen, setBellOpen] = useState(false);
  const [dismissed, setDismissed] = useState([]);

  const [showAddPen, setShowAddPen] = useState(false);
  const [addToPen, setAddToPen] = useState(null);
  const [showOffspring, setShowOffspring] = useState(false);
  const [showExpense, setShowExpense] = useState(false);
  const [showSale, setShowSale] = useState(false);
  const [editPen, setEditPen] = useState(null);
  const [showSell, setShowSell] = useState(false);
  const [showTransfer, setShowTransfer] = useState(false);

  const [toast, setToast] = useState(null);
  const notify = useCallback((msg, type = "success") => {
    setToast({ msg, type });
    clearTimeout(notify._t);
    notify._t = setTimeout(() => setToast(null), 2600);
  }, []);

  const now = new Date();

  const alerts = useMemo(() => {
    const list = [];
    animals.forEach((a) => {
      if (!a.alive) return;
      if (a.penId) {
        const pen = pens.find((p) => p.id === a.penId);
        if (pen && pen.alertEnabled !== false && pen.alertDays && a.penEnteredAt) {
          const d = daysBetween(new Date(a.penEnteredAt), now);
          if (d >= pen.alertDays) list.push({ id: `pen-${a.id}`, kind: "pen", text: `الكائن #${a.number} (${a.color}) في "${pen.name}" منذ ${d} يوم` });
        }
      }
      if (a.vaccinationDate && new Date(a.vaccinationDate) <= now) {
        list.push({ id: `vac-${a.id}`, kind: "vaccine", text: `تطعيم مستحق للكائن #${a.number} (${a.color})` });
      }
    });
    return list.filter((a) => !dismissed.includes(a.id));
  }, [animals, pens, dismissed]);

  const selected = animals.find((a) => a.id === selectedId) || null;

  const addAnimal = (data) => {
    const dup = animals.some((a) => a.number === data.number && a.color === data.color);
    if (dup) { notify(`الرقم ${data.number} باللون ${data.color} مستخدم مسبقاً`, "error"); return; }
    setAnimals((p) => [...p, { id: uid(), category: "mother", gender: "أنثى", alive: true, twinned: false, vaccinationDate: null, penId: null, penEnteredAt: null, addedAt: new Date().toISOString(), ...data }]);
    notify("تمت الإضافة");
  };

  const addOffspring = (list) => {
    for (const o of list) {
      const dupExisting = animals.some((a) => a.number === o.number && a.color === o.color);
      const dupBatch = list.filter((x) => x !== o).some((x) => x.number === o.number && x.color === o.color);
      if (dupExisting || dupBatch) { notify(`الرقم ${o.number} باللون ${o.color} مستخدم مسبقاً`, "error"); return; }
    }
    const created = list.map((o) => ({ id: uid(), category: "newborn", gender: o.gender, number: o.number, color: o.color, alive: true, twinned: false, vaccinationDate: null, birthDate: o.birthDate || null, penId: null, penEnteredAt: null, motherId: selected.id, addedAt: new Date().toISOString() }));
    setAnimals((p) => {
      const merged = [...p, ...created];
      const totalForMother = merged.filter((a) => a.motherId === selected.id).length;
      return totalForMother >= 2 ? merged.map((a) => (a.id === selected.id ? { ...a, twinned: true } : a)) : merged;
    });
    setShowOffspring(false);
    notify("تمت الإضافة");
  };

  const updateAnimal = (id, patch) => setAnimals((p) => p.map((a) => (a.id === id ? { ...a, ...patch } : a)));

  const sellAnimal = (id, sale) => {
    const animal = animals.find((a) => a.id === id);
    if (!animal) return;
    setSales((p) => [...p, { id: uid(), desc: sale.desc || `بيع كائن #${animal.number} (${animal.color})`, amount: sale.amount, date: sale.date }]);
    setAnimals((p) => p.filter((a) => a.id !== id));
    setShowSell(false);
    setPage("home");
    setSelectedId(null);
    notify("تم تسجيل البيع وحذف الكائن");
  };

  const addPen = (data) => { setPens((p) => [...p, { id: uid(), alertEnabled: true, ...data }]); setShowAddPen(false); notify("تمت الإضافة"); };
  const updatePen = (id, patch) => setPens((p) => p.map((pn) => (pn.id === id ? { ...pn, ...patch } : pn)));
  const deletePen = (id) => {
    setPens((p) => p.filter((pn) => pn.id !== id));
    setAnimals((p) => p.map((a) => (a.penId === id ? { ...a, penId: null, penEnteredAt: null } : a)));
  };

  const assignToPen = (animalId, penId) => { updateAnimal(animalId, { penId, penEnteredAt: new Date().toISOString() }); setAddToPen(null); notify("تمت الإضافة"); };
  const removeFromPen = (animalId) => updateAnimal(animalId, { penId: null, penEnteredAt: null });
  const transferAnimal = (animalId, penId) => { updateAnimal(animalId, { penId, penEnteredAt: new Date().toISOString() }); setShowTransfer(false); notify("تم النقل"); };

  const addExpense = (data) => { setExpenses((p) => [...p, { id: uid(), ...data }]); setShowExpense(false); notify("تمت الإضافة"); };
  const addSale = (data) => { setSales((p) => [...p, { id: uid(), ...data }]); setShowSale(false); notify("تمت الإضافة"); };
  const resetFinance = () => { setExpenses([]); setSales([]); notify("تم تصفير المصروفات والمبيعات لسنة مالية جديدة"); };

  const openAnimal = (id) => { setSelectedId(id); setPage("animal"); };

  return (
    <div dir="rtl" lang="ar" style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "'Tajawal', sans-serif", paddingBottom: 78 }}>
      <div style={{ maxWidth: 720, margin: "0 auto", padding: "18px 16px 8px" }}>
        {page === "home" && (
          <HomePage animals={animals} pens={pens} alerts={alerts} bellOpen={bellOpen} setBellOpen={setBellOpen}
            onDismiss={(id) => setDismissed((d) => [...d, id])}
            onAddAnimal={addAnimal} onOpenAnimal={openAnimal} />
        )}
        {page === "pens" && (
          <PensPage pens={pens} animals={animals} onAddPen={() => setShowAddPen(true)}
            onAddToPen={(pen) => setAddToPen(pen)} onOpenAnimal={openAnimal}
            onRemoveFromPen={removeFromPen} onEditPen={(pen) => setEditPen(pen)} />
        )}
        {page === "finance" && (
          <FinancePage expenses={expenses} sales={sales} onAddExpense={() => setShowExpense(true)} onAddSale={() => setShowSale(true)}
            onDeleteExpense={(id) => setExpenses((p) => p.filter((e) => e.id !== id))}
            onDeleteSale={(id) => setSales((p) => p.filter((s) => s.id !== id))}
            onResetFinance={resetFinance} />
        )}
        {page === "reports" && <ReportsPage animals={animals} pens={pens} expenses={expenses} sales={sales} />}
        {page === "animal" && selected && (
          <AnimalDetailPage animal={selected} mother={animals.find((a) => a.id === selected.motherId)}
            offspring={animals.filter((a) => a.motherId === selected.id)} pen={pens.find((p) => p.id === selected.penId)}
            onBack={() => setPage("home")} onUpdate={(patch) => updateAnimal(selected.id, patch)}
            onAddOffspring={() => setShowOffspring(true)} onOpenAnimal={openAnimal}
            onSell={() => setShowSell(true)} onTransfer={() => setShowTransfer(true)} />
        )}
      </div>

      <BottomNav page={page} setPage={(p) => { setPage(p); setBellOpen(false); }} />

      {toast && (
        <div style={{ position: "fixed", bottom: 88, insetInlineStart: "50%", transform: "translateX(-50%)", background: toast.type === "error" ? C.brick : C.text, color: "#fff", borderRadius: 999, padding: "10px 20px", fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 8, zIndex: 70, boxShadow: "0 10px 30px rgba(59,51,36,0.35)", maxWidth: "90vw", textAlign: "center" }}>
          {toast.type === "error" ? "✕" : "✓"} {toast.msg}
        </div>
      )}

      {showAddPen && <AddPenModal onSave={addPen} onClose={() => setShowAddPen(false)} />}
      {editPen && (
        <EditPenModal pen={editPen}
          onSave={(patch) => { updatePen(editPen.id, patch); setEditPen(null); }}
          onDelete={() => { deletePen(editPen.id); setEditPen(null); }}
          onClose={() => setEditPen(null)} />
      )}
      {addToPen && <AddToPenModal pen={addToPen} animals={animals.filter((a) => a.alive && !a.penId)} onAssign={assignToPen} onClose={() => setAddToPen(null)} />}
      {showOffspring && selected && <OffspringModal mother={selected} animals={animals} onSave={addOffspring} onClose={() => setShowOffspring(false)} />}
      {showSell && selected && <SellAnimalModal animal={selected} onSell={(sale) => sellAnimal(selected.id, sale)} onClose={() => setShowSell(false)} />}
      {showTransfer && selected && (
        <PenTransferModal animal={selected} pens={pens} currentPenId={selected.penId}
          onTransfer={(penId) => transferAnimal(selected.id, penId)}
          onRemove={() => { removeFromPen(selected.id); setShowTransfer(false); notify("تم الإخراج من الحظيرة"); }}
          onClose={() => setShowTransfer(false)} />
      )}
      {showExpense && <ExpenseModal onSave={addExpense} onClose={() => setShowExpense(false)} />}
      {showSale && <SaleModal onSave={addSale} onClose={() => setShowSale(false)} />}
    </div>
  );
}

// ---------------- bottom nav ----------------
function BottomNav({ page, setPage }) {
  const items = [
    { id: "home", label: "الرئيسية", icon: "🏠" },
    { id: "pens", label: "الحظائر", icon: "🧱" },
    { id: "finance", label: "المالية", icon: "💰" },
    { id: "reports", label: "التقارير", icon: "📊" },
  ];
  return (
    <div style={{ position: "fixed", bottom: 0, insetInlineStart: 0, insetInlineEnd: 0, background: C.surface, borderTop: `1px solid ${C.border}`, display: "flex", zIndex: 40 }}>
      <div style={{ maxWidth: 720, margin: "0 auto", display: "flex", width: "100%" }}>
        {items.map((it) => {
          const active = page === it.id || (page === "animal" && it.id === "home");
          return (
            <button key={it.id} onClick={() => setPage(it.id)} style={{ flex: 1, background: "none", border: "none", padding: "10px 4px 8px", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, cursor: "pointer", color: active ? C.olive : C.muted }}>
              <span style={{ fontSize: 19 }}>{it.icon}</span>
              <span style={{ fontSize: 11, fontWeight: active ? 700 : 500 }}>{it.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ==================================================================
// PAGE 1 — HOME
// ==================================================================
function HomePage({ animals, pens, alerts, bellOpen, setBellOpen, onDismiss, onAddAnimal, onOpenAnimal }) {
  const [searchNum, setSearchNum] = useState("");
  const [searchColor, setSearchColor] = useState("الكل");
  const [catModal, setCatModal] = useState(null);

  const mothers = animals.filter((a) => a.category === "mother" && a.alive);
  const newborns = animals.filter((a) => a.category === "newborn" && a.alive);
  const newbornMales = newborns.filter((n) => n.gender === "ذكر").length;
  const newbornFemales = newborns.filter((n) => n.gender === "أنثى").length;
  const dead = animals.filter((a) => !a.alive);
  const producing = mothers.filter((m) => animals.some((o) => o.motherId === m.id));
  const nonProducing = mothers.filter((m) => !animals.some((o) => o.motherId === m.id));
  const twinning = mothers.filter((m) => m.twinned);
  const twinningPct = producing.length ? Math.round((twinning.length / producing.length) * 100) : 0;
  const vaccineList = animals.filter((a) => a.alive && a.vaccinationDate);

  const results = (searchNum || searchColor !== "الكل")
    ? animals.filter((a) => a.alive && (!searchNum || a.number === searchNum) && (searchColor === "الكل" || a.color === searchColor))
    : [];

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div>
          <h1 style={{ margin: 0, fontFamily: "'El Messiri', serif", fontSize: 23 }}>my farm</h1>
          <p style={{ margin: 0, fontSize: 12, color: C.muted }}>نظرة عامة على القطيع</p>
        </div>
        <AlertBell alerts={alerts} open={bellOpen} setOpen={setBellOpen} onDismiss={onDismiss} />
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
        <StatCard label="الأمهات" value={mothers.length} color={C.olive} />
        <StatCard label="المواليد" value={newborns.length} color={C.blue} sub={`${newbornFemales} أنثى · ${newbornMales} ذكر`} />
        <StatCard label="النفوق" value={dead.length} color={C.brick} />
      </div>
      <div style={{ marginBottom: 20 }}>
        <StatCard label="الأمهات المتأومة" value={twinning.length} color={C.gold} sub={`${twinningPct}% من الأمهات المنتجة`} />
      </div>

      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 16 }}>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>إضافة حلال (بدون حظيرة)</div>
        <InlineAddAnimal onSave={onAddAnimal} animals={animals} />
      </div>

      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>🔍 البحث عن كائن</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input style={{ ...inputStyle, flex: 1, minWidth: 100 }} placeholder="الرقم" value={searchNum} onChange={(e) => setSearchNum(e.target.value)} />
          <select style={{ ...inputStyle, flex: 1, minWidth: 120 }} value={searchColor} onChange={(e) => setSearchColor(e.target.value)}>

function InlineAddAnimal({ onSave, animals }) {
  const [number, setNumber] = useState("");
  const [color, setColor] = useState(TAG_COLORS[0].v);
  const [error, setError] = useState("");
  const canSave = number.trim().length > 0;
  const submit = () => {
    if (!canSave) return;
    const trimmed = number.trim();
    const dup = animals.some((a) => a.number === trimmed && a.color === color);
    if (dup) { setError(`الرقم ${trimmed} باللون ${color} مستخدم مسبقاً`); return; }
    setError("");
    onSave({ number: trimmed, color });
    setNumber("");
  };
  return (
    <div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <input style={{ ...inputStyle, flex: 1, minWidth: 90 }} placeholder="الرقم" value={number} onChange={(e) => { setNumber(e.target.value); setError(""); }} />
        <select style={{ ...inputStyle, flex: 1, minWidth: 120 }} value={color} onChange={(e) => { setColor(e.target.value); setError(""); }}>
          {TAG_COLORS.map((t) => <option key={t.v} value={t.v}>{t.v}</option>)}
        </select>
        <button onClick={submit} disabled={!canSave} style={{ ...btnPrimary, opacity: canSave ? 1 : 0.5 }}>＋ إضافة</button>
      </div>
      {error && <div style={{ color: C.brick, fontSize: 12, marginTop: 8 }}>{error}</div>}
    </div>
  );
}

function OffspringModal({ mother, animals, onSave, onClose }) {
  const [rows, setRows] = useState([{ gender: "أنثى", number: "", color: TAG_COLORS[0].v }]);
  const [birthDate, setBirthDate] = useState(todayStr());
  const [error, setError] = useState("");
  const update = (i, patch) => { setRows((r) => r.map((row, idx) => (idx === i ? { ...row, ...patch } : row))); setError(""); };
  const addRow = () => rows.length < 3 && setRows((r) => [...r, { gender: "أنثى", number: "", color: TAG_COLORS[0].v }]);
  const removeRow = (i) => setRows((r) => r.filter((_, idx) => idx !== i));
  const valid = rows.every((r) => r.number.trim());
  const submit = () => {
    if (!valid) return;
    const trimmedRows = rows.map((r) => ({ ...r, number: r.number.trim(), birthDate }));
    for (let i = 0; i < trimmedRows.length; i++) {
      const r = trimmedRows[i];
      const dupExisting = animals.some((a) => a.number === r.number && a.color === r.color);
      const dupWithinBatch = trimmedRows.some((r2, j) => j !== i && r2.number === r.number && r2.color === r.color);
      if (dupExisting || dupWithinBatch) { setError(`الرقم ${r.number} باللون ${r.color} مستخدم مسبقاً`); return; }
    }
    onSave(trimmedRows);
  };
  return (
    <Modal title={`إضافة مواليد — أم #${mother.number}`} onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        <Field label="تاريخ الميلاد"><input type="date" style={inputStyle} value={birthDate} onChange={(e) => setBirthDate(e.target.value)} /></Field>
        {rows.map((r, i) => (
          <div key={i} style={{ border: `1px solid ${C.border}`, borderRadius: 12, padding: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ fontSize: 12, fontWeight: 700, color: C.muted }}>مولود {i + 1}</span>
              {rows.length > 1 && <button onClick={() => removeRow(i)} style={{ ...iconBtn, color: C.brick }}>✕</button>}
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <select style={{ ...inputStyle, flex: 1, minWidth: 90 }} value={r.gender} onChange={(e) => update(i, { gender: e.target.value })}>
                <option>أنثى</option><option>ذكر</option>
              </select>
              <input style={{ ...inputStyle, flex: 1, minWidth: 80 }} placeholder="الرقم" value={r.number} onChange={(e) => update(i, { number: e.target.value })} />
              <select style={{ ...inputStyle, flex: 1, minWidth: 100 }} value={r.color} onChange={(e) => update(i, { color: e.target.value })}>
                {TAG_COLORS.map((t) => <option key={t.v} value={t.v}>{t.v}</option>)}
              </select>
            </div>
          </div>
        ))}
        {rows.length < 3 && <button onClick={addRow} style={btnGhost}>＋ إضافة مولود آخر (حتى ٣)</button>}
        {error && <div style={{ color: C.brick, fontSize: 12 }}>{error}</div>}
        <button onClick={submit} disabled={!valid} style={{ ...btnPrimary, justifyContent: "center", opacity: valid ? 1 : 0.5 }}>حفظ المواليد</button>
      </div>
    </Modal>
  );
}

function FinancePage({ expenses, sales, onAddExpense, onAddSale, onDeleteExpense, onDeleteSale, onResetFinance }) {
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);
  const inRange = (d) => (!from || d >= from) && (!to || d <= to);
  const fExp = expenses.filter((e) => inRange(e.date));
  const fSales = sales.filter((s) => inRange(s.date));
  const totalExpense = fExp.reduce((a, b) => a + Number(b.amount), 0);
  const totalSales = fSales.reduce((a, b) => a + Number(b.amount), 0);
  const net = totalSales - totalExpense;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 style={{ margin: 0, fontFamily: "'El Messiri', serif", fontSize: 21 }}>المالية</h1>
        <button onClick={() => setConfirmReset(true)} style={{ ...btnGhost, color: C.brick }}>📅 سنة مالية جديدة</button>
      </div>

      {confirmReset && (
        <div style={{ border: `1px solid ${C.brick}55`, background: `${C.brick}10`, borderRadius: 12, padding: 14, marginBottom: 16, textAlign: "center" }}>
          <div style={{ fontSize: 13, marginBottom: 10 }}>سيتم تصفير كل المصروفات والمبيعات المسجلة نهائياً لبدء سنة مالية جديدة. هل أنت متأكد؟</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => { onResetFinance(); setConfirmReset(false); }} style={{ ...btnPrimary, background: C.brick, flex: 1, justifyContent: "center" }}>تأكيد التصفير</button>
            <button onClick={() => setConfirmReset(false)} style={{ ...btnGhost, flex: 1, justifyContent: "center" }}>تراجع</button>
          </div>
        </div>
      )}

      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 16, padding: 20, textAlign: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 12, color: C.muted }}>الصافي (مبيعات − مصروفات)</div>
        <div style={{ fontSize: 34, fontWeight: 700, color: net >= 0 ? C.olive : C.brick, fontFamily: "'El Messiri', serif" }}>{net.toLocaleString()} ﷼</div>
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
        <StatCard label="المبيعات" value={`${totalSales.toLocaleString()} ﷼`} color={C.olive} />
        <StatCard label="المصروفات" value={`${totalExpense.toLocaleString()} ﷼`} color={C.brick} />
      </div>

      <div style={{ background: C.surface2, borderRadius: 12, padding: 12, display: "flex", gap: 8, alignItems: "center", marginBottom: 20, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, color: C.muted }}>📅 تقرير لفترة:</span>
        <input type="date" style={{ ...inputStyle, width: "auto", flex: 1, minWidth: 130 }} value={from} onChange={(e) => setFrom(e.target.value)} />
        <span style={{ color: C.muted, fontSize: 12 }}>إلى</span>
        <input type="date" style={{ ...inputStyle, width: "auto", flex: 1, minWidth: 130 }} value={to} onChange={(e) => setTo(e.target.value)} />
        {(from || to) && <button onClick={() => { setFrom(""); setTo(""); }} style={{ ...iconBtn }}>✕</button>}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style={{ fontWeight: 700, fontSize: 14 }}>المصروفات</div>
        <button onClick={onAddExpense} style={btnGhost}>＋ مصروف</button>
      </div>
      {fExp.length === 0 ? <EmptyState text="لا توجد مصروفات ضمن هذه الفترة." /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
          {[...fExp].reverse().map((e) => (
            <div key={e.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "10px 14px", display: "flex", alignItems: "center", gap: 10 }}>
              <span>📉</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{e.desc || e.category}</div>
                <div style={{ fontSize: 11, color: C.muted }}>{e.category} · {fmtDate(e.date)}</div>
              </div>
              <div style={{ fontWeight: 700, color: C.brick, fontSize: 13 }}>-{Number(e.amount).toLocaleString()}</div>
              <button onClick={() => onDeleteExpense(e.id)} style={{ ...iconBtn, color: C.brick }}>🗑</button>
            </div>
          ))}
        </div>
      )}

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style={{ fontWeight: 700, fontSize: 14 }}>المبيعات</div>
        <button onClick={onAddSale} style={btnGhost}>＋ مبيعة</button>
      </div>
      {fSales.length === 0 ? <EmptyState text="لا توجد مبيعات ضمن هذه الفترة." /> : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {[...fSales].reverse().map((s) => (
            <div key={s.id} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: "10px 14px", display: "flex", alignItems: "center", gap: 10 }}>
              <span>📈</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{s.desc || "بيع حلال"}</div>
                <div style={{ fontSize: 11, color: C.muted }}>{fmtDate(s.date)}</div>
              </div>
              <div style={{ fontWeight: 700, color: C.olive, fontSize: 13 }}>+{Number(s.amount).toLocaleString()}</div>
              <button onClick={() => onDeleteSale(s.id)} style={{ ...iconBtn, color: C.brick }}>🗑</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ExpenseModal({ onSave, onClose }) {
  const [f, setF] = useState({ category: EXPENSE_CATEGORIES[0], desc: "", amount: "", date: todayStr() });
  return (
    <Modal title="إضافة مصروف" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <Field label="نوع المصروف">
          <select style={inputStyle} value={f.category} onChange={(e) => setF({ ...f, category: e.target.value })}>
            {EXPENSE_CATEGORIES.map((c) => <option key={c}>{c}</option>)}
          </select>
        </Field>
        <Field label="شرح العملية"><input style={inputStyle} value={f.desc} onChange={(e) => setF({ ...f, desc: e.target.value })} placeholder="تفاصيل إضافية (اختياري)" /></Field>
        <div style={{ display: "flex", gap: 10 }}>
          <Field label="المبلغ (﷼)"><input type="number" style={inputStyle} value={f.amount} onChange={(e) => setF({ ...f, amount: e.target.value })} /></Field>
          <Field label="تاريخ العملية"><input type="date" style={inputStyle} value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></Field>
        </div>
        <button onClick={() => f.amount && onSave(f)} disabled={!f.amount} style={{ ...btnPrimary, justifyContent: "center", opacity: f.amount ? 1 : 0.5 }}>حفظ</button>
      </div>
    </Modal>
  );
}

function SaleModal({ onSave, onClose }) {
  const [f, setF] = useState({ desc: "", amount: "", date: todayStr() });
  return (
    <Modal title="إضافة مبيعة" onClose={onClose}>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <Field label="شرح العملية"><input style={inputStyle} value={f.desc} onChange={(e) => setF({ ...f, desc: e.target.value })} placeholder="مثال: بيع خروف" /></Field>
        <div style={{ display: "flex", gap: 10 }}>
          <Field label="المبلغ (﷼)"><input type="number" style={inputStyle} value={f.amount} onChange={(e) => setF({ ...f, amount: e.target.value })} /></Field>
          <Field label="تاريخ العملية"><input type="date" style={inputStyle} value={f.date} onChange={(e) => setF({ ...f, date: e.target.value })} /></Field>
        </div>
        <button onClick={() => f.amount && onSave(f)} disabled={!f.amount} style={{ ...btnPrimary, justifyContent: "center", opacity: f.amount ? 1 : 0.5 }}>حفظ</button>
      </div>
    </Modal>
  );
}

// ==================================================================
// PAGE 4 — REPORTS
// ==================================================================
function ReportsPage({ animals, pens, expenses, sales }) {
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const inRange = (d) => (!from || d >= from) && (!to || d <= to);
  const fExp = expenses.filter((e) => inRange(e.date));
  const fSales = sales.filter((s) => inRange(s.date));
  const totalExpense = fExp.reduce((a, b) => a + Number(b.amount), 0);
  const totalSales = fSales.reduce((a, b) => a + Number(b.amount), 0);

  const byCategory = EXPENSE_CATEGORIES.map((cat) => ({ name: cat, value: fExp.filter((e) => e.category === cat).reduce((a, b) => a + Number(b.amount), 0) })).filter((d) => d.value > 0);
  const maxCat = Math.max(1, ...byCategory.map((d) => d.value));

  const monthKey = (d) => d.slice(0, 7);
  const months = Array.from(new Set([...fExp, ...fSales].map((x) => monthKey(x.date)))).sort();
  const monthly = months.map((m) => ({
    name: m,
    sales: fSales.filter((s) => monthKey(s.date) === m).reduce((a, b) => a + Number(b.amount), 0),
    expenses: fExp.filter((e) => monthKey(e.date) === m).reduce((a, b) => a + Number(b.amount), 0),
  }));
  const maxMonthly = Math.max(1, ...monthly.map((m) => Math.max(m.sales, m.expenses)));

  const mothers = animals.filter((a) => a.category === "mother" && a.alive);
  const newbornsInRange = animals.filter((a) => a.category === "newborn" && a.addedAt && inRange(a.addedAt.slice(0, 10)));
  const deathsInRange = animals.filter((a) => !a.alive && a.deathAt && inRange(a.deathAt.slice(0, 10)));
  const producingPct = mothers.length ? Math.round((mothers.filter((m) => animals.some((o) => o.motherId === m.id)).length / mothers.length) * 100) : 0;

  const upcomingVax = animals.filter((a) => a.alive && a.vaccinationDate).sort((a, b) => new Date(a.vaccinationDate) - new Date(b.vaccinationDate));

  const penSummary = pens.map((p) => {
    const list = animals.filter((a) => a.penId === p.id && a.alive);
    const avgDays = list.length ? Math.round(list.reduce((a, an) => a + daysBetween(new Date(an.penEnteredAt), new Date()), 0) / list.length) : 0;
    return { ...p, count: list.length, avgDays };
  });

  return (
    <div>
      <h1 style={{ margin: "0 0 16px", fontFamily: "'El Messiri', serif", fontSize: 21 }}>التقارير الشاملة</h1>

      <div style={{ background: C.surface2, borderRadius: 12, padding: 12, display: "flex", gap: 8, alignItems: "center", marginBottom: 18, flexWrap: "wrap" }}>
        <span>📅</span>
        <input type="date" style={{ ...inputStyle, width: "auto", flex: 1, minWidth: 130 }} value={from} onChange={(e) => setFrom(e.target.value)} />
        <span style={{ color: C.muted, fontSize: 12 }}>إلى</span>
        <input type="date" style={{ ...inputStyle, width: "auto", flex: 1, minWidth: 130 }} value={to} onChange={(e) => setTo(e.target.value)} />
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 22, flexWrap: "wrap" }}>
        <StatCard label="صافي الربح" value={`${(totalSales - totalExpense).toLocaleString()} ﷼`} color={totalSales - totalExpense >= 0 ? C.olive : C.brick} />
        <StatCard label="المبيعات" value={`${totalSales.toLocaleString()} ﷼`} color={C.olive} />
        <StatCard label="المصروفات" value={`${totalExpense.toLocaleString()} ﷼`} color={C.brick} />
      </div>

      {byCategory.length > 0 && (
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12 }}>المصروفات حسب النوع</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {byCategory.map((d) => (
              <div key={d.name}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}>
                  <span>{d.name}</span><span style={{ color: C.muted }}>{d.value.toLocaleString()} ﷼</span>
                </div>
                <MiniBar value={d.value} max={maxCat} color={C.brick} />
              </div>
            ))}
          </div>
        </div>
      )}

      {monthly.length > 0 && (
        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 12 }}>المبيعات مقابل المصروفات شهرياً</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            {monthly.map((m) => (
              <div key={m.name}>
                <div style={{ fontSize: 12, color: C.muted, marginBottom: 6 }}>{m.name}</div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginBottom: 3 }}><span style={{ color: C.olive }}>مبيعات</span><span>{m.sales.toLocaleString()}</span></div>
                <MiniBar value={m.sales} max={maxMonthly} color={C.olive} />
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, margin: "6px 0 3px" }}><span style={{ color: C.brick }}>مصروفات</span><span>{m.expenses.toLocaleString()}</span></div>
                <MiniBar value={m.expenses} max={maxMonthly} color={C.brick} />
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>إحصائيات القطيع (خلال الفترة)</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <StatCard label="مواليد جدد" value={newbornsInRange.length} color={C.blue} />
          <StatCard label="نفوق" value={deathsInRange.length} color={C.brick} />
          <StatCard label="نسبة الأمهات المنتجة" value={`${producingPct}%`} color={C.olive} />
        </div>
      </div>

      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16, marginBottom: 20 }}>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>التطعيمات القادمة</div>
        {upcomingVax.length === 0 ? <div style={{ fontSize: 12, color: C.muted }}>لا توجد مواعيد تطعيم مسجلة.</div> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {upcomingVax.map((a) => (
              <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.bg, borderRadius: 10, padding: "8px 12px" }}>
                <TagBadge number={a.number} color={a.color} />
                <span style={{ fontSize: 12, color: new Date(a.vaccinationDate) <= new Date() ? C.brick : C.muted }}>{fmtDate(a.vaccinationDate)}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: 16 }}>
        <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>ملخص الحظائر</div>
        {penSummary.length === 0 ? <div style={{ fontSize: 12, color: C.muted }}>لا توجد حظائر.</div> : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {penSummary.map((p) => (
              <div key={p.id} style={{ display: "flex", justifyContent: "space-between", background: C.bg, borderRadius: 10, padding: "8px 12px", fontSize: 12.5 }}>
                <span style={{ fontWeight: 700 }}>{p.name}</span>
                <span style={{ color: C.muted }}>{p.count} كائن · متوسط {p.avgDays} يوم</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
